name: Test

# PR이 develop/main으로 열리거나 갱신될 때마다 자동 실행 — 머지 전 검증용.
# deploy-dev.yml/deploy-prod.yml은 머지 "후" 배포만 하지 머지 "전" 검증은 안 하므로 별도로 둔다.
on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
