spring:
  application:
    name: vita-be

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vita_local}
    username: ${DB_USERNAME:vita}
    password: ${DB_PASSWORD:local1234}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway 도입 시점부터 validate로 전환 (08_개발표준 4절)
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
