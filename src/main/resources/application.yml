spring:
  application:
    name: vita-be

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vita_local}
    username: ${DB_USERNAME:vita}
    password: ${DB_PASSWORD:local1234}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway 도입 시점부터 validate로 전환 (08_개발표준 4절)
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    # ErrorResponse.fieldErrors처럼 값이 없을 때(null) 응답 body에서 아예 빼기 위함 (04_API명세서 0절)
    default-property-inclusion: non_null
    time-zone: Asia/Seoul

server:
  port: 8080

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
