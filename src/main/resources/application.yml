spring:
  application:
    name: vita-be

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vita_local}
    username: ${DB_USERNAME:vita}
    password: ${DB_PASSWORD:local1234}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway 도입 시점부터 validate로 전환 (08_개발표준 4절)
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    # ErrorResponse.fieldErrors처럼 값이 없을 때(null) 응답 body에서 아예 빼기 위함 (04_API명세서 0절)
    default-property-inclusion: non_null
    time-zone: Asia/Seoul

  ai:
    bedrock:
      aws:
        region: ${AWS_REGION:ap-northeast-1}
      converse:
        chat:
          options:
            model: ${BEDROCK_MODEL_ID:openai.gpt-oss-120b-1:0}
            temperature: 0.3
            max-tokens: 1024


server:
  port: 8080
  # Nginx 뒤에 있을 때 원 요청 프로토콜(X-Forwarded-Proto)을 인식시킨다.
  # 없으면 Swagger가 서버 주소를 http://로 만들어, HTTPS 페이지에서 mixed content로 차단된다.
  forward-headers-strategy: framework

  servlet:
    session:
      cookie:
        # 세션 쿠키(JSESSIONID)를 accessToken과 같은 속성으로 발급한다.
        #
        # 기본값으로 두면 Secure/SameSite가 붙지 않아 두 가지 문제가 생긴다.
        # 1) 소셜 로그인은 제공자를 거쳐 돌아오는 크로스사이트 흐름이라, SameSite가 Lax(기본)면
        #    브라우저가 세션 쿠키를 보내지 않는다. 서버는 state 검증용 세션을 찾지 못한다.
        # 2) 로그아웃이 내려보내는 만료 쿠키와 속성이 달라, 브라우저가 다른 쿠키로 보고 지우지 않는다.
        #    남은 세션이 다음 소셜 로그인의 state 검증을 어긋나게 한다.
        secure: ${COOKIE_SECURE:false}
        same-site: ${COOKIE_SAME_SITE:Lax}
        http-only: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

app:
  cookie:
    # 로컬은 http라 Secure를 못 쓴다. 배포(HTTPS)에서는 true + SameSite=None이어야
    # 프론트(Vercel)와 백엔드(EC2)처럼 도메인이 다른 환경에서 쿠키가 전달된다.
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}

  oauth2:
    # 소셜 인증 후 토큰을 실어 보낼 프론트 주소. FE 콜백 경로 확정 시 .env로 덮어쓴다.
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth/callback}

jwt:
  # HS256은 32바이트 이상을 요구한다. 운영 값은 반드시 환경변수로 주입하고 커밋하지 않는다.
  secret: ${JWT_SECRET:local-dev-secret-key-change-me-in-production-32bytes}
  access-token-expire-millis: ${JWT_ACCESS_EXPIRE:3600000}   # 1시간

# 필요할 때만 명시적으로 켜는 합성 FAQ JSONL 적재기.
# 같은 faq_id(source_faq_id)는 갱신되므로 재실행해도 중복 행이 생기지 않는다.
faq:
  collection:
    enabled: ${FAQ_COLLECTION_ENABLED:false}
    base-url: ${FAQ_COLLECTION_BASE_URL:https://www.lguplus.com/uhdc/fo/cusp/onqa/v1}
    main-category: ${FAQ_COLLECTION_MAIN_CATEGORY:}
    page-size: ${FAQ_COLLECTION_PAGE_SIZE:10}
    max-main-categories: ${FAQ_COLLECTION_MAX_MAIN_CATEGORIES:1}
    max-subcategories-per-main: ${FAQ_COLLECTION_MAX_SUBCATEGORIES_PER_MAIN:1}
    max-pages-per-subcategory: ${FAQ_COLLECTION_MAX_PAGES_PER_SUBCATEGORY:1}
    max-details: ${FAQ_COLLECTION_MAX_DETAILS:10}
    request-delay-ms: ${FAQ_COLLECTION_REQUEST_DELAY_MS:500}
    output: ${FAQ_COLLECTION_OUTPUT:build/faq/faq_all_cleaned.jsonl}
  import:
    enabled: ${FAQ_IMPORT_ENABLED:false}
    resource: ${FAQ_IMPORT_RESOURCE:classpath:data/faq/cleaned/faq_all_cleaned.jsonl}
  embedding:
    enabled: ${FAQ_EMBEDDING_ENABLED:false}
    batch-size: ${FAQ_EMBEDDING_BATCH_SIZE:100}

# Flyway 요금제 시드 적재 후 명시적으로 켤 때만 임베딩한다.
plan:
  embedding:
    enabled: ${PLAN_EMBEDDING_ENABLED:false}
    batch-size: ${PLAN_EMBEDDING_BATCH_SIZE:100}

embedding:
  # 로컬 Hugging Face Text Embeddings Inference 서버
  base-url: ${EMBEDDING_BASE_URL:http://localhost:8081}

retrieval:
  # "관련 FAQ 없음" 판단 기준(0~1). 기존 소량 데이터에서 사용하던 값을 유지한다.
  # 합성 FAQ 1,000건 적재·임베딩 후 정답/오답 질의로 재평가하기 전까지는 잠정값이다.
  similarity-threshold: ${RETRIEVAL_SIMILARITY_THRESHOLD:0.83}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # 태그/API를 알파벳순이 아니라 선언 순서로 보여준다
    operations-sorter: alpha
    tags-sorter: alpha
  default-produces-media-type: application/json

# 카카오 길찾기(모빌리티 Directions / 카카오맵 경로) REST API 키. 소셜 로그인용 KAKAO_CLIENT_ID와는 별개.
# 기본값을 비워둬서 키가 없어도 앱은 기동되고, 길찾기 호출만 실패한다.
kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}

---
# 소셜 로그인 설정. `oauth` 프로파일이 켜져 있을 때만 로드된다.
#
# 이렇게 분리한 이유: 키가 비어 있으면 Spring이 "Client id must not be empty"로 기동 자체를
# 막는다. 항상 로드되게 두면 OAuth 키가 없는 팀원은 서버를 띄울 수 없다.
# 사용법 — .env에 SPRING_PROFILES_ACTIVE=local,oauth 로 활성화한다.
spring:
  config:
    activate:
      on-profile: oauth

  security:
    oauth2:
      client:
        registration:
          # 구글은 Spring이 엔드포인트를 내장하고 있어 키와 scope만 적으면 된다.
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile, email

          # 카카오·네이버는 국내 서비스라 provider 블록에 주소를 직접 적어야 한다.
          kakao:
            client-id: ${KAKAO_CLIENT_ID}          # REST API 키 (JavaScript 키 아님)
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            # 이메일은 비즈앱 전환 전까지 받을 수 없어 요청하지 않는다.
            # 로그인 식별은 (provider, provider_id)로 하므로 이메일이 없어도 동작한다.
            scope: profile_nickname
            client-name: Kakao

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: name, email
            client-name: Naver

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            # 네이버는 실제 값이 response 안에 한 겹 들어 있다.
            user-name-attribute: response

