spring:
  application:
    name: vita-be

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vita_local}
    username: ${DB_USERNAME:vita}
    password: ${DB_PASSWORD:local1234}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway 도입 시점부터 validate로 전환 (08_개발표준 4절)
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    # ErrorResponse.fieldErrors처럼 값이 없을 때(null) 응답 body에서 아예 빼기 위함 (04_API명세서 0절)
    default-property-inclusion: non_null
    time-zone: Asia/Seoul

server:
  port: 8080
  # Nginx 뒤에 있을 때 원 요청 프로토콜(X-Forwarded-Proto)을 인식시킨다.
  # 없으면 Swagger가 서버 주소를 http://로 만들어, HTTPS 페이지에서 mixed content로 차단된다.
  forward-headers-strategy: framework

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

app:
  cookie:
    # 로컬은 http라 Secure를 못 쓴다. 배포(HTTPS)에서는 true + SameSite=None이어야
    # 프론트(Vercel)와 백엔드(EC2)처럼 도메인이 다른 환경에서 쿠키가 전달된다.
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}

  oauth2:
    # 소셜 인증 후 토큰을 실어 보낼 프론트 주소. FE 콜백 경로 확정 시 .env로 덮어쓴다.
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth/callback}

jwt:
  # HS256은 32바이트 이상을 요구한다. 운영 값은 반드시 환경변수로 주입하고 커밋하지 않는다.
  secret: ${JWT_SECRET:local-dev-secret-key-change-me-in-production-32bytes}
  access-token-expire-millis: ${JWT_ACCESS_EXPIRE:3600000}   # 1시간

# 필요할 때만 명시적으로 켜는 합성 FAQ JSONL 적재기.
# 같은 faq_id(source_faq_id)는 갱신되므로 로컬/AWS dev에서 여러 번 실행해도 중복 행이 생기지 않는다.
faq:
  import:
    enabled: ${FAQ_IMPORT_ENABLED:false}
    resource: ${FAQ_IMPORT_RESOURCE:classpath:data/faq/cleaned/faq_all_cleaned.jsonl}
  embedding:
    enabled: ${FAQ_EMBEDDING_ENABLED:false}
    batch-size: ${FAQ_EMBEDDING_BATCH_SIZE:100}

embedding:
  # 로컬 Hugging Face Text Embeddings Inference 서버
  base-url: ${EMBEDDING_BASE_URL:http://localhost:8081}

retrieval:
  # "관련 FAQ 없음" 판단 기준(0~1). 로밍/요금·납부/유심-eSIM 3개 카테고리 데이터로
  # 재측정해서 0.85 → 0.83으로 조정. 단순히 낮추면 다른 카테고리 FAQ가 잘못 매칭되는
  # 위험이 있어서(예: "심카드" 질문이 "신용카드" 요금 FAQ와 헷갈림, 0.8179), 그 값(0.8179)과
  # 로밍/요금 정답 파라프레이즈 점수(0.8423~0.8547) 사이인 0.83으로 잡음.
  similarity-threshold: ${RETRIEVAL_SIMILARITY_THRESHOLD:0.83}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # 태그/API를 알파벳순이 아니라 선언 순서로 보여준다
    operations-sorter: alpha
    tags-sorter: alpha
  default-produces-media-type: application/json

---
# 소셜 로그인 설정. `oauth` 프로파일이 켜져 있을 때만 로드된다.
#
# 이렇게 분리한 이유: 키가 비어 있으면 Spring이 "Client id must not be empty"로 기동 자체를
# 막는다. 항상 로드되게 두면 OAuth 키가 없는 팀원은 서버를 띄울 수 없다.
# 사용법 — .env에 SPRING_PROFILES_ACTIVE=local,oauth 로 활성화한다.
spring:
  config:
    activate:
      on-profile: oauth

  security:
    oauth2:
      client:
        registration:
          # 구글은 Spring이 엔드포인트를 내장하고 있어 키와 scope만 적으면 된다.
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile, email

          # 카카오·네이버는 국내 서비스라 provider 블록에 주소를 직접 적어야 한다.
          kakao:
            client-id: ${KAKAO_CLIENT_ID}          # REST API 키 (JavaScript 키 아님)
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            # 이메일은 비즈앱 전환 전까지 받을 수 없어 요청하지 않는다.
            # 로그인 식별은 (provider, provider_id)로 하므로 이메일이 없어도 동작한다.
            scope: profile_nickname
            client-name: Kakao

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: name, email
            client-name: Naver

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            # 네이버는 실제 값이 response 안에 한 겹 들어 있다.
            user-name-attribute: response
