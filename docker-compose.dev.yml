# EC2 dev 환경용. 09_인프라구성.md 2~3절 기준. 로컬에서 실행하지 않음 — EC2에서만.
# postgres는 컨테이너로 안 올림(RDS 사용), embedding만 컨테이너로 띄운다.
# 배포: docker compose -f docker-compose.dev.yml up -d --build
name: vita-dev

services:
  backend:
    # jar는 deploy-dev.yml이 러너에서 빌드해 app-dev.jar로 올려둔다. 서버에서는 복사만 한다.
    build:
      context: .
      dockerfile: Dockerfile.deploy
      args:
        JAR_FILE: app-dev.jar
    container_name: vita-backend-dev
    ports:
      - "8080:8080"
    env_file:
      - .env.dev
    environment:
      # 배포 워크플로가 export한 커밋 해시. 없으면 빈 값이고 traces.app_version은 비어 저장된다(기능에는 영향 없음).
      APP_VERSION: ${APP_VERSION:-}
    depends_on:
      - embedding
    restart: unless-stopped

  # RAG 검색(질문 임베딩 변환)용 TEI 서버. 로컬(docker-compose.embedding.yml)과 같은 이미지/모델.
  # host.docker.internal은 EC2(리눅스 Docker Engine)에서 못 써서 컨테이너로 직접 띄우고,
  # 백엔드는 .env.dev의 EMBEDDING_BASE_URL=http://embedding:80 으로 서비스명 접근한다.
  # prod 백엔드도 이 컨테이너를 같이 쓴다(docker-compose.prod.yml의 embedding-net, .env.prod의
  # EMBEDDING_BASE_URL=http://vita-embedding-dev:80). container_name과 프로젝트 이름(name: vita-dev)을 바꾸면 prod 검색이 끊긴다.
  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    container_name: vita-embedding-dev
    command: --model-id intfloat/multilingual-e5-base
    volumes:
      - embedding-model-data:/data
    restart: unless-stopped

volumes:
  embedding-model-data:
