# EC2 dev 환경용. 09_인프라구성.md 2~3절 기준. 로컬에서 실행하지 않음 — EC2에서만.
# postgres는 컨테이너로 안 올림(RDS 사용), redis만 컨테이너로 띄운다.
# 배포: docker compose -f docker-compose.dev.yml up -d --build
name: vita-dev

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vita-backend-dev
    ports:
      - "8080:8080"
    env_file:
      - .env.dev
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: vita-redis-dev
    restart: unless-stopped
