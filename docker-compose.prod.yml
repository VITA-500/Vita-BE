# EC2 prod(발표/데모)용. 09_인프라구성.md 2~3절 기준. 로컬에서 실행하지 않음 — EC2에서만.
# postgres는 컨테이너로 안 올림(RDS 사용), redis만 컨테이너로 띄운다.
# dev와 같은 EC2 인스턴스에서 포트로만 구분해서 같이 띄운다 (8080=dev, 8000=prod).
# 임베딩(TEI) 서버는 메모리 때문에 prod에서 따로 띄우지 않고 dev의 vita-embedding-dev를 같이 쓴다.
# dev 스택(docker-compose.dev.yml)이 먼저 떠 있어야 하며, 없으면 아래 external 네트워크를 못 찾아 prod도 기동하지 않는다.
# 배포: docker compose -f docker-compose.prod.yml up -d --build
name: vita-prod

services:
  backend:
    # jar는 deploy-prod.yml이 러너에서 빌드해 app-prod.jar로 올려둔다. 서버에서는 복사만 한다.
    build:
      context: .
      dockerfile: Dockerfile.deploy
      args:
        JAR_FILE: app-prod.jar
    container_name: vita-backend-prod
    ports:
      - "8000:8080"
    env_file:
      - .env.prod
    depends_on:
      - redis
    # default는 prod 내부(redis), embedding-net은 dev의 임베딩 서버(vita-embedding-dev)에 닿기 위한 네트워크다.
    # redis처럼 dev와 이름이 겹치는 서비스를 헷갈리지 않도록 .env.prod에는 컨테이너 이름(vita-embedding-dev)을 쓴다.
    networks:
      - default
      - embedding-net
    restart: always

  redis:
    image: redis:7
    container_name: vita-redis-prod
    restart: always

networks:
  # dev 스택의 기본 네트워크(프로젝트 이름 vita-dev). docker-compose.dev.yml의 name을 바꾸면 이 값도 같이 바꿔야 한다.
  embedding-net:
    external: true
    name: vita-dev_default
